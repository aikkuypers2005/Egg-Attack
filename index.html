<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#08070d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Egg Attack">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <title>Egg Attack</title>
  <style>
    @font-face { font-family: 'Press Start 2P'; src: url('lib/press-start-2p.woff2') format('woff2'); }
    html, body { margin: 0; height: 100%; background: #08070d; overflow: hidden; overscroll-behavior: none; }
    body { position: fixed; left: 0; top: 0; right: 0; bottom: 0; touch-action: none;
           -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    canvas { image-rendering: crisp-edges; image-rendering: pixelated; display: block; }

    /* The stage is the whole screen in landscape. src/touch.js sizes it, and turns it a quarter when a phone is held upright. */
    #stage { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; transform-origin: 0 0;
             display: flex; align-items: center; justify-content: center;
             --u: 1vh; --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px); }
    #stage.rot { --sl: env(safe-area-inset-top, 0px); --sr: env(safe-area-inset-bottom, 0px); }

    /* Touch buttons. --u is 1% of the height of the game picture. */
    #tc { position: absolute; left: 0; top: 0; right: 0; bottom: 0; pointer-events: none; font-family: 'Press Start 2P', monospace; }
    .tc { position: absolute; pointer-events: auto; box-sizing: border-box; display: flex; align-items: center; justify-content: center;
          color: #fff; background: rgba(12, 10, 22, 0.42); border: calc(var(--u) * 0.7) solid rgba(255, 255, 255, 0.62); border-radius: 50%;
          font-size: calc(var(--u) * 3.1); text-shadow: 0 calc(var(--u) * 0.45) 0 #0c0a16; touch-action: none; cursor: pointer; }
    .tc.dn { background: rgba(255, 232, 104, 0.5); border-color: #fff; }
    .tc-left, .tc-right { width: calc(var(--u) * 21); height: calc(var(--u) * 21); bottom: calc(var(--u) * 7); border-radius: 22%; }
    .tc-left { left: calc(var(--u) * 4 + var(--sl)); }
    .tc-right { left: calc(var(--u) * 28 + var(--sl)); }
    .tc-left i, .tc-right i { width: 0; height: 0; border: calc(var(--u) * 4.5) solid transparent; }
    .tc-left i { border-right-color: #fff; margin-right: calc(var(--u) * 4.5); }
    .tc-right i { border-left-color: #fff; margin-left: calc(var(--u) * 4.5); }
    .tc-bite { width: calc(var(--u) * 25); height: calc(var(--u) * 25); right: calc(var(--u) * 4 + var(--sr)); bottom: calc(var(--u) * 12); border-color: rgba(255, 128, 104, 0.85); }
    #tc.lobby .tc-bite { width: calc(var(--u) * 16); height: calc(var(--u) * 16); right: calc(var(--u) * 3 + var(--sr)); bottom: calc(var(--u) * 27); font-size: calc(var(--u) * 2.5); }
    .tc-jump { width: calc(var(--u) * 21); height: calc(var(--u) * 21); right: calc(var(--u) * 31 + var(--sr)); bottom: calc(var(--u) * 5); border-color: rgba(255, 232, 104, 0.85); }
    .tc-grab { width: calc(var(--u) * 17); height: calc(var(--u) * 17); right: calc(var(--u) * 8 + var(--sr)); bottom: calc(var(--u) * 40); border-color: rgba(120, 232, 120, 0.85); font-size: calc(var(--u) * 2.6); }
    .tc-pause { width: calc(var(--u) * 11); height: calc(var(--u) * 11); right: calc(var(--u) * 3 + var(--sr)); top: var(--pt, calc(var(--u) * 11)); border-radius: 22%; font-size: calc(var(--u) * 2.8); }
    .tc-full { width: calc(var(--u) * 11); height: calc(var(--u) * 11); left: calc(var(--u) * 3 + var(--sl)); top: calc(var(--u) * 3); border-radius: 22%; font-size: calc(var(--u) * 2.2); }
  </style>
</head>
<body>
  <div id="stage"></div>
  <script src="lib/p5.min.js"></script>
  <script src="lib/peerjs.min.js"></script>
  <script src="src/text.js"></script>
  <script src="src/sim.js"></script>
  <script src="src/sprites.js"></script>
  <script src="src/fx.js"></script>
  <script src="src/draw.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/input.js"></script>
  <script src="src/touch.js"></script>
  <script src="src/snapshot.js"></script>
  <script src="src/net.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
